  $('#actions').on('change input', '[data-f]', function () { var a = actions[+this.dataset.i]; var f = this.dataset.f; a[f] = (f === 'target' || f === 'op') ? +this.value : this.value; if (f === 'target') { a.op = a.target === 4012 ? 331 : 312; a.p1 = a.target === 4012 ? 2 : a.target === 4005 ? 1 : 0; } if (this.tagName === 'SELECT') renderActions(); render(); });
  $('#actions').on('click', '[data-del]', function () { actions.splice(+this.dataset.del, 1); renderActions(); render(); });
  $('#addAction').on('click', function () { var t = ATARGETS[kind][0]; actions.push({target: t, op: t === 4012 ? 331 : 304, p1: t === 4012 ? 2 : 1, p2: 0}); if ($('#func').val() === '0' || $('#func').val() === '6' || $('#func').val() === '8') $('#func').val('1'); renderActions(); render(); });
  function actionToObj(a) {
    if (a.target === 4012) return M.trackOp(a.op, parseVal(a.p1));
    if (a.target === 4006) return M.actType(a.op, parseVal(a.p1));
    if (a.target === 4005) return M.actChannel(a.op, Math.max(0, parseVal(a.p1) - 1));
    if (a.op === 307 || a.op === 308) return M.actFloat(a.target, a.op, parseVal(a.p1));
    return M.actInt(a.target, a.op, parseVal(a.p1), parseVal(a.p2));
  }
  /* Funktionen, Vorschau, Export, Import */
  function renderFunc() { $('#func').html(Object.keys(C.functions).filter(function (k) { return kind === 'LE' || [0, 1, 6, 8].indexOf(+k) >= 0; }).map(function (k) { return '<option value="' + k + '"' + (k === '1' ? ' selected' : '') + '>' + C.functions[k] + (C.functionsInferred[k] ? ' 🟡' : '') + '</option>'; }).join('')); }
  function buildDoc() {
    var rules = $b.queryBuilder('getRules', {skip_empty: true}); if (!rules) throw new Error('Filter unvollständig oder ungültig.');
    return {magic: 0x4000, one: 1, comment: new Uint8Array(0), actions: actions.map(actionToObj), filters: groupToTokens(rules), trailer: M.trailer(+$('#func').val(), kind === 'PLE')};
  }
  function render() {
    var msgs = [];
    try { var d = buildDoc(), bytes = LE.encode(d), desc = LE.describe(d); $('#preview').text(desc.text + '\n' + bytes.length + ' Bytes'); }
    catch (e) { $('#preview').text('⚠ ' + e.message); }
    if (actions.length && ['0', '6', '8'].indexOf($('#func').val()) >= 0) msgs.push(['warn', 'Aktionen werden bei dieser Funktion ignoriert.']);
    if (!actions.length && ['1', '2', '3', '4', '5', '7'].indexOf($('#func').val()) >= 0) msgs.push(['warn', 'Funktion ohne Aktionszeilen ändert nichts.']);
    $('#msgs').html(msgs.map(function (m) { return '<li class="' + m[0] + '">' + m[1] + '</li>'; }).join(''));
  }
  $('#func').on('change', render);
  $('#btnExport').on('click', function () {
    var d = buildDoc(), xml = LE.toXml(kind === 'PLE' ? 'Project_Logical_EditorPreset' : 'Logical_EditPreset', LE.encode(d), 1);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([xml], {type: 'application/xml'})); a.download = ($('#presetName').val() || 'Preset').replace(/[\\/:*?"<>|]/g, '_') + '.xml'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  function importText(text, fname) {
    try {
      var px = LE.parseXml(text), d = LE.decode(px.bytes), k = px.root === 'Project_Logical_EditorPreset' ? 'PLE' : 'LE';
      if (k !== kind) { kind = k; $('input[name=kind][value=' + k + ']').prop('checked', true); renderFunc(); }
      actions = []; var skipped = 0;
      d.actions.forEach(function (o) { var objs = o.items.filter(function (x) { return typeof x !== 'number'; }); if ((o.target === 4002 || o.target === 4003 || o.target === 4025 || o.target === 4024 || o.target === 4022) && objs.length >= 2 && 'value' in objs[0]) actions.push({target: o.target === 4025 ? 4002 : (o.target === 4024 || o.target === 4022) ? 4003 : o.target, op: o.op, p1: objs[0].value, p2: objs[1].value}); else if (o.target === 4005 && objs[0]) actions.push({target: 4005, op: o.op, p1: objs[0].value + 1, p2: 0}); else if (o.target === 4012 && objs[0]) actions.push({target: 4012, op: o.op, p1: objs[0].value, p2: 0}); else if (o.target === 4006 && objs[0]) actions.push({target: 4006, op: o.op, p1: objs[0].value, p2: 0}); else skipped++; });
      var g = tokensToGroup(d.filters.filter(function (t) { return t.type === 'token' || t.type === 'cond'; }));
      initBuilder(g); renderActions(); $('#func').val(String(d.trailer[1] != null ? d.trailer[1] : 1)); $('#presetName').val((fname || 'Import').replace(/\.xml$/i, '')); render();
      $('#importInfo').text('Geladen: ' + fname + ' (' + px.bytes.length + ' Bytes)' + (skipped ? ' – ' + skipped + ' Aktion(en) nicht abgebildet' : ''));
    } catch (e) { $('#importInfo').html('<span class="text-danger">Import fehlgeschlagen: ' + $('<i>').text(e.message).html() + '</span>'); }
  }
  $('#file').on('change', function () { var f = this.files[0]; if (f) f.text().then(function (t) { importText(t, f.name); }); });
  $('input[name=kind]').on('change', function () { kind = this.value; actions = []; renderFunc(); renderActions(); initBuilder(); });
  var RECIPES = [{name: '— Rezept —'},
    {name: 'Noten auf Zwei und Vier auswählen', kind: 'LE', func: 6, rules: {condition: 'AND', rules: [{id: 'type', operator: 'equal', value: 0}, {condition: 'OR', rules: [{id: 'position_bar', operator: 'between', value: [460, 500]}, {id: 'position_bar', operator: 'between', value: [1420, 1460]}]}]}, actions: []},
    {name: 'Alle CC vor dem Cursor löschen', kind: 'LE', func: 0, rules: {condition: 'AND', rules: [{id: 'type', operator: 'equal', value: 2}, {id: 'value1', operator: 'between', value: ['0', '127']}, {id: 'position_time', operator: 'before_cursor', value: 'x'}]}, actions: []},
    {name: 'Kurze Noten (< 60 Ticks) löschen', kind: 'LE', func: 0, rules: {condition: 'AND', rules: [{id: 'type', operator: 'equal', value: 0}, {id: 'length', operator: 'less', value: 60}]}, actions: []},
    {name: 'Aftertouch → CC1 (Type ändern)', kind: 'LE', func: 1, rules: {condition: 'AND', rules: [{id: 'type', operator: 'equal', value: 4}]}, actions: [{target: 4006, op: 312, p1: 2, p2: 0}, {target: 4002, op: 312, p1: 1, p2: 0}]},
    {name: 'PLE: Gemutete MIDI-Parts löschen', kind: 'PLE', func: 0, rules: {condition: 'AND', rules: [{id: 'media', operator: 'equal', value: 1}, {id: 'container', operator: 'equal', value: 2}, {id: 'property', operator: 'is_set', value: 0}]}, actions: []},
    {name: 'PLE: Spuren mit „voc“ im Namen muten (Toggle)', kind: 'PLE', func: 1, rules: {condition: 'AND', rules: [{id: 'container', operator: 'equal', value: 1}, {id: 'name', operator: 'contains', value: 'voc'}]}, actions: [{target: 4012, op: 335, p1: 2, p2: 0}]}];
  $('#recipes').html(RECIPES.map(function (r, i) { return '<option value="' + i + '">' + r.name + '</option>'; }).join('')).on('change', function () {
    var r = RECIPES[+this.value]; if (!r.rules) return; kind = r.kind; $('input[name=kind][value=' + kind + ']').prop('checked', true); renderFunc(); actions = r.actions.slice(); renderActions(); initBuilder(r.rules); $('#func').val(String(r.func)); $('#presetName').val(r.name.replace(/^PLE: /, '')); render(); this.value = 0;
  });
  renderFunc(); renderActions(); initBuilder();
})(jQuery);
